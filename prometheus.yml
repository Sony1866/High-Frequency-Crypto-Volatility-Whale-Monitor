global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'faust-app'
    static_configs:
      - targets: ['faust:8000']
    metrics_path: /
    scheme: http

  - job_name: 'faust-web'
    static_configs:
      - targets: ['faust:6066']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']